<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410" role="img" aria-labelledby="decay-title decay-desc">
  <title id="decay-title">KDA bounded log decay</title>
  <desc id="decay-desc">A bounded sigmoid maps a decay logit to a log-decay value between minus five and zero, which keeps per-step retention between e to the minus five and one.</desc>
  <style>
    .decay{color:currentColor;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.decay .card{fill:Canvas;stroke:currentColor;stroke-opacity:.28;stroke-width:1.5}.decay .axis{stroke:currentColor;stroke-opacity:.38;stroke-width:1.5}.decay .grid{stroke:currentColor;stroke-opacity:.14;stroke-width:1}.decay .label{fill:currentColor;font-size:14px;font-weight:700;letter-spacing:.08em}.decay .body{fill:currentColor;font-size:15px;fill-opacity:.76}.decay .math{fill:currentColor;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:17px}.decay .accent{stroke:#0F8A80;fill:none;stroke-width:4}.decay .dot{fill:#0F8A80}.decay .bound{stroke:#E0912B;stroke-width:2;stroke-dasharray:6 5}.decay .amber{fill:#E0912B;font-size:14px;font-weight:700}
  </style>
  <g class="decay">
    <text x="30" y="38" class="label">Bounded channel decay</text><text x="30" y="64" class="body">The log-decay is clipped by construction before it is exponentiated into retention.</text>
    <rect class="card" x="30" y="92" width="500" height="282" rx="14"/>
    <line class="axis" x1="94" y1="124" x2="94" y2="332"/><line class="axis" x1="94" y1="332" x2="486" y2="332"/>
    <line class="grid" x1="94" y1="145" x2="486" y2="145"/><line class="grid" x1="94" y1="238" x2="486" y2="238"/><line class="grid" x1="94" y1="318" x2="486" y2="318"/>
    <text class="body" x="54" y="150">0</text><text class="body" x="42" y="243">−2.5</text><text class="body" x="48" y="323">−5</text><text class="body" x="103" y="357">low zₜ</text><text class="body" x="422" y="357">high zₜ</text>
    <line class="bound" x1="94" y1="318" x2="486" y2="318"/><path class="accent" d="M108 315 C170 315 210 309 246 285 C283 260 306 228 331 197 C356 166 392 147 472 145"/>
    <circle class="dot" cx="302" cy="233" r="6"/><text class="math" x="160" y="119">gₜ = −5 · sigmoid(eᴬʰzₜ)</text>
    <rect class="card" x="558" y="92" width="272" height="282" rx="14"/>
    <text class="label" x="586" y="132">What the bound buys</text>
    <text class="math" x="586" y="174">−5 &lt; gₜ &lt; 0</text><text class="body" x="586" y="201">log-decay per token</text>
    <line class="axis" x1="586" y1="222" x2="802" y2="222"/>
    <text class="math" x="586" y="255">e⁻⁵ &lt; αₜ &lt; 1</text><text class="body" x="586" y="282">per-step retention</text>
    <text class="amber" x="586" y="324">16-token tile: g ≥ −80</text><text class="body" x="586" y="348">stays in the bf16 dynamic range</text>
  </g>
</svg>
